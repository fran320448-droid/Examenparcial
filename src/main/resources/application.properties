# Valores de desarrollo: se leen desde variables de entorno.
# Si la variable no existe, se usa el valor por defecto (solo para XAMPP local).

# Puerto: local 8080; en Render usa SERVER_PORT o el PORT inyectado por la plataforma
server.port=${SERVER_PORT:${PORT:8080}}

# Conexion MySQL (XAMPP local. En Render se definen las variables reales)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mensajes de error claros (Spring Boot 3)
server.error.include-message=always
server.error.include-stacktrace=never

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
