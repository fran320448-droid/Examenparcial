services:
  - type: web
    name: techservices-api
    runtime: java
    plan: free
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/techservices-api-1.0.0.jar"
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
